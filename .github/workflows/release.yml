name: Build Cross-Platform Release

on:
  push:
    branches: [k98m-golden-cat]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      linux_only:
        description: 'Only build Linux (x86_64 + ARM64) packages'
        type: boolean
        default: false
      macos_only:
        description: 'Only build macOS Universal (10.15+) packages'
        type: boolean
        default: false
      release_tag:
        description: 'Optional tag label for artifact naming (e.g. v4.7.0)'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.linux_only || inputs.macos_only)) }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app (Windows x64 - 65% Classic Installer)
        run: npm run tauri -- build --bundles nsis

      - name: Rename Windows installer asset
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME -match '^v') { $env:GITHUB_REF_NAME } else { 'latest' }
          $ver = $tag.TrimStart('v')
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if ($nsis) {
            Copy-Item $nsis.FullName "KuroCat-$ver-x64-setup.exe"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kurocat-windows-x64
          path: |
            KuroCat-*-x64-setup.exe

      - name: Publish Windows assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            KuroCat-*-x64-setup.exe

  build-macos:
    if: ${{ github.ref != 'refs/heads/k98m-golden-cat' && !(github.event_name == 'workflow_dispatch' && inputs.linux_only) }}
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable (Apple Silicon + Intel Universal)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri Universal macOS .app
        run: npm run tauri -- build --target universal-apple-darwin --bundles app

      - name: Sign, package and verify Universal macOS .dmg and .app.tar.gz
        env:
          # Optional. Without these secrets the app is signed ad hoc and the release still succeeds,
          # but users have to grant Accessibility / Input Monitoring again after every update.
          # Create the certificate once with: scripts/macos-codesign.sh create-cert <dir outside the repo>
          MACOS_SIGNING_CERT_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          TAG="${{ inputs.release_tag }}"
          if [[ -z "$TAG" ]]; then
            if [[ "${GITHUB_REF_NAME}" =~ ^v ]]; then
              TAG="${GITHUB_REF_NAME}"
            else
              TAG="v$(node -p "require('./package.json').version")"
            fi
          fi
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/KuroCat.app"
          test -d "$APP_PATH"
          echo "=== Verify macOS minimum version & Universal slices ==="
          plutil -p "$APP_PATH/Contents/Info.plist" | grep -i MinimumSystemVersion || true
          lipo -info "$APP_PATH/Contents/MacOS/KuroCat"
          otool -arch x86_64 -l "$APP_PATH/Contents/MacOS/KuroCat" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" || true
          otool -arch arm64 -l "$APP_PATH/Contents/MacOS/KuroCat" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" || true
          echo "=== Sign every architecture with a stable identity ==="
          scripts/macos-codesign.sh sign "$APP_PATH"
          REQUIREMENT="$(scripts/macos-codesign.sh requirement "$APP_PATH")"
          mkdir -p dmg_staging
          cp -R "$APP_PATH" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "KuroCat" -srcfolder dmg_staging -ov -format UDZO "KuroCat-${TAG}-macos-universal.dmg"
          tar -czf "KuroCat-${TAG}-macos-universal.app.tar.gz" -C "src-tauri/target/universal-apple-darwin/release/bundle/macos" "KuroCat.app"
          ls -lh "KuroCat-${TAG}-macos-universal.dmg" "KuroCat-${TAG}-macos-universal.app.tar.gz"
          echo "=== Verify the app inside each release artifact ==="
          scripts/macos-codesign.sh verify-artifact "KuroCat-${TAG}-macos-universal.dmg" "$REQUIREMENT"
          scripts/macos-codesign.sh verify-artifact "KuroCat-${TAG}-macos-universal.app.tar.gz" "$REQUIREMENT"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kurocat-macos-universal
          path: |
            KuroCat-*-macos-universal.dmg
            KuroCat-*-macos-universal.app.tar.gz

      - name: Publish macOS assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            KuroCat-*-macos-universal.dmg
            KuroCat-*-macos-universal.app.tar.gz

  build-linux:
    if: ${{ github.ref != 'refs/heads/k98m-golden-cat' && !(github.event_name == 'workflow_dispatch' && inputs.macos_only) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Run Linux Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Linux .deb (KylinOS / Ubuntu / Debian / UOS)
        run: npm run tauri -- build --bundles deb

      - name: Build Tauri Linux .AppImage (best-effort)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: |
          npm run tauri -- build --bundles appimage || echo "AppImage bundle skipped on ${{ matrix.arch }}"

      - name: Smoke-test Linux binary and inspect ELF / .deb metadata
        run: |
          BIN="src-tauri/target/release/KuroCat"
          test -x "$BIN"
          echo "=== Dynamic libraries ==="
          ldd "$BIN"
          echo "=== Max GLIBC symbols required ==="
          objdump -T "$BIN" | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -n 10
          echo "=== MCP stdio live smoke test ==="
          RESP=$(printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}\n' | "$BIN" --mcp)
          echo "$RESP"
          echo "$RESP" | grep -q '"name":"kurocat"'
          echo "=== DEB metadata ==="
          DEB=$(ls src-tauri/target/release/bundle/deb/*.deb | head -n 1)
          dpkg-deb -I "$DEB"

      - name: Rename Linux packages
        shell: bash
        run: |
          TAG="${{ inputs.release_tag }}"
          if [[ -z "$TAG" ]]; then
            if [[ "${GITHUB_REF_NAME}" =~ ^v ]]; then
              TAG="${GITHUB_REF_NAME}"
            else
              TAG="v$(node -p "require('./package.json').version")"
            fi
          fi
          ARCH="${{ matrix.arch }}"
          DEB=$(ls src-tauri/target/release/bundle/deb/*.deb | head -n 1)
          cp "$DEB" "KuroCat-${TAG}-linux-${ARCH}.deb"
          APPIMG=$(ls src-tauri/target/release/bundle/appimage/*.AppImage 2>/dev/null | head -n 1 || true)
          if [[ -n "$APPIMG" && -f "$APPIMG" ]]; then
            cp "$APPIMG" "KuroCat-${TAG}-linux-${ARCH}.AppImage"
          fi
          ls -lh KuroCat-${TAG}-linux-${ARCH}.*

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kurocat-linux-${{ matrix.arch }}
          path: |
            KuroCat-*-linux-${{ matrix.arch }}.deb
            KuroCat-*-linux-${{ matrix.arch }}.AppImage

      - name: Publish Linux assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            KuroCat-*-linux-${{ matrix.arch }}.deb
            KuroCat-*-linux-${{ matrix.arch }}.AppImage
