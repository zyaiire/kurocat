<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KuroCat</title>
  </head>
  <body>
    <canvas id="pet-canvas"></canvas>
    <canvas id="pet-canvas-3d" class="hidden"></canvas>

    <div id="update-toast" class="update-toast hidden" role="status" aria-live="polite">
      <span class="update-toast-text" id="update-toast-text">✨ 发现新版本</span>
      <button class="update-toast-btn hidden" id="btn-toast-install" type="button">立即更新</button>
      <button class="update-toast-btn secondary hidden" id="btn-toast-open" type="button">发布页</button>
      <button class="update-toast-close" id="btn-toast-close" type="button" title="稍后提醒">×</button>
    </div>

    <div id="tail-picker-bar" class="tail-picker-bar hidden" role="dialog" aria-label="自定义尾巴按键">
      <button
        class="tail-picker-close"
        id="btn-tail-cancel"
        type="button"
        aria-label="取消选键"
        title="取消选键"
      ></button>
      <div class="tail-picker-top">
        <span class="tail-picker-title" id="tail-picker-title">🐾 点键帽或敲键盘（已选 4 键）</span>
        <button class="tail-picker-done" id="btn-tail-done" type="button">确定</button>
      </div>
      <div class="tail-picker-actions">
        <div class="tail-picker-presets">
          <button class="tail-preset-btn" data-tailpreset="office" type="button" aria-pressed="false">回车空格</button>
          <button class="tail-preset-btn" data-tailpreset="rightFn" type="button" aria-pressed="false">方向/小键盘</button>
          <button class="tail-preset-btn" data-tailpreset="edgeMods" type="button" aria-pressed="false">外侧功能键</button>
        </div>
        <button class="tail-preset-btn danger" data-tailpreset="clear" type="button">清空</button>
      </div>
    </div>

    <div id="context-menu" class="context-menu hidden">
      <div class="menu-header" id="menu-header">🐈‍⬛ KuroCat 小黑猫</div>
      <div class="menu-scale-row">
        <span class="menu-scale-label">角色外观（支持 MCP 定制）</span>
        <div class="breed-pills" id="breed-pills">
          <button class="breed-pill active" data-breed="black">🐈‍⬛ 小黑猫</button>
          <button class="breed-pill" data-breed="ragdoll">🐱 布偶猫</button>
          <button class="breed-pill" data-breed="dafeiyu">🐳 大肥鱼</button>
        </div>
      </div>
      <div class="menu-scale-row" id="render-mode-row">
        <span class="menu-scale-label">视觉模式（可选 3D / 2D）</span>
        <div class="kb-pills">
          <button class="kb-pill active" data-rendermode="3d" type="button">✨ 3D 立体</button>
          <button class="kb-pill" data-rendermode="2d" type="button">🎨 2D 经典</button>
        </div>
      </div>
      <div class="menu-scale-row" id="collar-row">
        <span class="menu-scale-label">3D 项圈铃铛</span>
        <div class="collar-pills">
          <button class="kb-pill active" data-collar="none" type="button">无</button>
          <button class="kb-pill" data-collar="red" type="button">红</button>
          <button class="kb-pill" data-collar="blue" type="button">蓝</button>
          <button class="kb-pill" data-collar="pink" type="button">粉</button>
          <button class="kb-pill" data-collar="green" type="button">绿</button>
        </div>
      </div>
      <div class="menu-scale-row" id="headphone-row">
        <span class="menu-scale-label">电竞耳机</span>
        <div class="render-mode-pills">
          <button class="kb-pill active" data-headphonemode="off" type="button">关闭</button>
          <button class="kb-pill" data-headphonemode="auto" type="button">🎮 游戏自动</button>
          <button class="kb-pill" data-headphonemode="on" type="button">🎧 常戴</button>
        </div>
      </div>
      <div class="menu-sep"></div>
      <button class="menu-item" data-action="toggle-privacy" title="检测到输入密码时猫猫自动闭眼、大肥鱼双手捂眼并隐藏全部按键">
        <span>输密码自动闭眼防偷窥</span>
        <span class="menu-check" id="chk-privacy">✓</span>
      </button>
      <button class="menu-item" data-action="toggle-bubbles">
        <span>悬浮按键气泡</span>
        <span class="menu-check" id="chk-bubbles">✓</span>
      </button>
      <button class="menu-item" data-action="toggle-lock" title="开启后按住 Alt 键仍可拖动或右键解锁">
        <span>锁定鼠标穿透（Alt 解锁）</span>
        <span class="menu-check" id="chk-lock"></span>
      </button>
      <button class="menu-item" data-action="toggle-sound">
        <span>摸头呼噜声</span>
        <span class="menu-check" id="chk-sound">✓</span>
      </button>
      <button class="menu-item" data-action="toggle-top">
        <span>始终置顶显示</span>
        <span class="menu-check" id="chk-top">✓</span>
      </button>
      <button class="menu-item" data-action="toggle-autostart">
        <span>开机自动启动</span>
        <span class="menu-check" id="chk-autostart"></span>
      </button>
      <div class="menu-sep"></div>
      <button class="menu-item" data-action="toggle-mcp">
        <span>开启 MCP 扩展</span>
        <span class="menu-check" id="chk-mcp">✓</span>
      </button>
      <button class="menu-item" data-action="copy-mcp" id="btn-copy-mcp">
        <span>复制 MCP 配置</span>
        <span class="menu-hint" id="mcp-copy-hint">AI 捏猫</span>
      </button>
      <div class="menu-sep"></div>
      <div class="menu-scale-row">
        <span class="menu-scale-label">键盘配列与方向</span>
        <div class="kb-pills">
          <button class="kb-pill active" data-kblayout="65">65% 紧凑</button>
          <button class="kb-pill" data-kblayout="108">108 全尺寸</button>
          <button class="kb-pill" data-kblayout="k98m">K98M Plus</button>
        </div>
        <div class="kb-pills">
          <button class="kb-pill active" data-kborient="cat">面向猫咪</button>
          <button class="kb-pill" data-kborient="viewer">面向观众</button>
        </div>
      </div>
      <div class="menu-scale-row">
        <div class="scale-header">
          <span class="menu-scale-label">尾巴拍键模式</span>
          <span class="tail-mode-badge" id="tail-mode-badge">智能第三只手</span>
        </div>
        <div class="tail-mode-pills">
          <button class="kb-pill active" data-tailmode="smart" title="平时双手打字，两手忙不过来或敲完回车时自动出尾">智能</button>
          <button class="kb-pill" data-tailmode="custom" title="只拍你亲手勾选的按键">自定义</button>
          <button class="kb-pill" data-tailmode="edge" title="近尾外侧边缘区（不拆 WASD）">边缘</button>
          <button class="kb-pill" data-tailmode="off" title="尾巴只自然摆动，不拍任何键">关闭</button>
        </div>
        <button class="tail-pick-trigger" data-action="open-tail-picker" id="btn-open-tail-picker" type="button">
          <span>🐾 在键盘上点选尾巴按键</span>
          <span class="menu-hint" id="tail-keys-count">4 键</span>
        </button>
      </div>
      <div class="menu-scale-row">
        <div class="scale-header">
          <span class="menu-scale-label">尺寸缩放</span>
          <button class="scale-value-btn" id="scale-value" type="button" title="点击复位 100%">100%</button>
        </div>
        <div class="scale-slider-wrap">
          <input
            type="range"
            id="scale-slider"
            class="scale-slider"
            min="20"
            max="150"
            step="1"
            value="100"
          />
          <div class="scale-ticks">
            <span>20%</span>
            <span class="scale-tick-mid">100%</span>
            <span>150%</span>
          </div>
        </div>
      </div>
      <div class="menu-sep"></div>
      <button class="menu-item" data-action="desktop-shortcut" id="btn-desktop-shortcut">
        <span>创建桌面图标</span>
        <span class="menu-hint" id="shortcut-hint">KuroCat</span>
      </button>
      <button class="menu-item" data-action="reset-pos">
        <span>重置位置到右下角</span>
      </button>
      <button class="menu-item" data-action="check-update" id="btn-check-update">
        <span>检查更新</span>
        <span class="menu-hint" id="update-hint">v5.0.1</span>
      </button>
      <button class="menu-item danger" data-action="quit">
        <span>退出 KuroCat</span>
      </button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
